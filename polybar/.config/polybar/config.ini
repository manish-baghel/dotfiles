[bar/i3wmthemer_bar]
monitor = ${env:MONITOR:}
width = 50%
height = 30px
radius = 0
offset-x = 25%
offset-y = 0
border-size = 0
border-color =
padding-left = 2
padding-right = 2

fixed-center = true

; ARGB
background = #1f1f1f
foreground = #c6c6c6

line-size = 2
line-color =


module-margin-left = 1
module-margin-right = 2

font-0 = "JetBrainsMono Nerd Font Mono:size=11;2"

modules-left = pulseaudio tray i3
modules-center = date
modules-right = cpu network bluetooth-autoconnect

wm-restack = i3
override-redirect = true

cursor-click = pointer
cursor-scroll = ns-resize

[module/tray]
type = internal/tray
tray-size = 68%
tray-spacing = 8px
tray-padding = 0px

[module/i3]
type = internal/i3
pin-workspaces = true
index-sort = true
show-urgent = true
strip-wsnumbers = true
enable-click = true
enable-scroll = true
wrapping-scroll = true
reverse-scroll = false
fuzzy-match = true

format = <label-state> <label-mode>

label-mode = %mode%
label-mode-padding = 2
label-mode-foreground = #828282
label-mode-background = #1f1f1f

label-focused = %index%
label-focused-background = #5A9B92
label-focused-foreground = #1f1f1f
label-focused-padding = 2

label-unfocused = %index%
label-unfocused-background = #8abeb7
label-unfocused-foreground = #1f1f1f
label-unfocused-padding = 2

label-visible = %index%
label-visible-background = #8abeb7
label-visible-foreground = #1f1f1f
label-visible-padding = 2

label-urgent = %index%
label-urgent-background = #BA2922
label-urgent-padding = 2

[module/pulseaudio]
type = internal/pulseaudio
use-ui-max = false
interval = 5
reverse-scroll = false
format-volume = <ramp-volume> <label-volume>
label-muted = 󰸈 muted
label-muted-foreground = #bbb
ramp-volume-0 =󰕿
ramp-volume-1 =󰖀
ramp-volume-2 =󰕾  
# icons can be copied from https://www.nerdfonts.com/cheat-sheet
click-right = pavucontrol

[module/network]
type = internal/network
interval = 1.0
interface-type = wireless
accumulate-stats = true
unknown-as-up = true
speed-unit =
format-connected = <ramp-signal> <label-connected>
format-disconnected = <label-disconnected>
format-packetloss = <animation-packetloss> <label-connected>
label-connected = %netspeed% 
label-connected-foreground = #eefafa
label-disconnected = 󰱭 not connected
label-disconnected-foreground = #ff8888
ramp-signal-0 = 󰞃
ramp-signal-1 = 󰢿
ramp-signal-2 = 󰢼
ramp-signal-3 = 󰢽
ramp-signal-4 = 󰢾
ramp-signal-5 = 
animation-packetloss-0 = 󱘖
animation-packetloss-0-foreground = #dd9999
animation-packetloss-1 = 󰌙
animation-packetloss-1-foreground = #000000
animation-packetloss-framerate = 500

[module/cpu]
type = internal/cpu
interval = 0.5
warn-percentage = 90

format = <label> <ramp-coreload>
label = " %percentage:2%%"
label-warn = " %percentage:2%%"

ramp-coreload-spacing = 0
ramp-coreload-0 = ▁
ramp-coreload-1 = ▂
ramp-coreload-2 = ▃
ramp-coreload-3 = ▄
ramp-coreload-4 = ▅
ramp-coreload-5 = ▆
ramp-coreload-6 = ▇
ramp-coreload-7 = █
ramp-coreload-0-foreground = #bde4df
ramp-coreload-1-foreground = #bde4ef
ramp-coreload-2-foreground = #bde4ff
ramp-coreload-3-foreground = #ade4ff
ramp-coreload-4-foreground = #bdb4ff
ramp-coreload-5-foreground = #ddb4fe
ramp-coreload-6-foreground = #ffb4bb
ramp-coreload-7-foreground = #ff5555

[module/date]
type = internal/date
interval = 0.5

date = " %m-%d"
date-alt = " %Y-%m-%d"

time = %H:%M:%S
time-alt = %H:%M:%S

format-prefix = 󱑏
format-foreground = #1f1f1f
format-background = #8abeb7
format-padding = 2

label = %date% %time%

[module/bluetooth-autoconnect]
type = custom/script
exec = ~/.config/i3/scripts/bluetooth-autoconnect.sh polybar
interval = 3

click-left = ~/.config/i3/scripts/bluetooth-autoconnect.sh menu &
click-middle = ~/.config/i3/scripts/bluetooth-autoconnect.sh status &
click-right = ~/.config/i3/scripts/bluetooth-autoconnect.sh restart &

format-padding = 1

[settings]
screenchange-reload = true

[global/wm]
margin-top = 0
margin-bottom = 0
